services:
  postgres:
    image: postgres:17-alpine
    container_name: gomic-postgres
    environment:
      POSTGRES_DB: gomic
      POSTGRES_USER: gomic
      POSTGRES_PASSWORD: gomic_dev_password
    ports:
      - "5432:5432"
    volumes:
      - gomic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomic -d gomic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gomic-postgres-data:
